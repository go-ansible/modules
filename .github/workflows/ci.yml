name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # go-ansible/template's tag lagged proxy.golang.org's per-version
  # indexing (@latest/@v/list resolved it immediately; the versioned
  # .info endpoint 404'd for several minutes after). Fetching straight
  # from git sidesteps that entirely; go.sum still pins every module's
  # content hash, so this only skips cross-checking those hashes against
  # the public transparency log for these same-owner modules.
  GOPROXY: direct
  GOSUMDB: "off"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go version
      # gofmt reports, it does not fail, so the check is the OUTPUT being
      # empty. A drifted file sat on main undetected until a local
      # `gofmt -l` turned it up while writing an unrelated change: vet,
      # build and test all pass on badly formatted code, so nothing here
      # was looking.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Test
        run: go test ./...

  # Compilation only, and deliberately not a test run. The test matrix above
  # is ubuntu + macos, so nothing here ever built for Windows and a single
  # call that types a socket differently there (syscall.SetsockoptInt takes a
  # syscall.Handle, not an int fd) broke the build for this package and for
  # every package importing it, unnoticed.
  #
  # It does not run the tests, because most of them shell out to a POSIX
  # shell and would fail for reasons that say nothing about portability.
  # Saying "it builds" is what this job can honestly claim.
  cross:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...

  # The modules that drive a real external binary, driven against the real
  # binary. iso_create / iso_customize shell out to xorriso and then read the
  # image back with it; the terraform module runs a real plan/apply cycle.
  # Those tests skipped on every push, so what was exercised was the argument
  # assembly and never the tool's answer.
  #
  # A job of its own rather than a leg of `test`: the matrix there covers
  # macOS, where these come from a different package manager, and neither tool
  # is needed to prove the pure-Go paths that job exists for.
  external-tools:
    name: real xorriso + terraform
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: xorriso, which writes the image and reads it back
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso
      # terraform_wrapper: false — the wrapper is a shell script that shadows
      # the binary, and these tests exec it directly.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Test, with both real binaries required
        env:
          # A skip here would look exactly like a pass.
          MODULES_REQUIRE_XORRISO: "1"
          MODULES_REQUIRE_TERRAFORM: "1"
        run: go test ./...

  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go env GOARCH && CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
